name: Generate SBOM

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  generate-sbom:
    runs-on: ubuntu-latest
    env:
      GITHUB_ACTION_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Generate SBOM with CycloneDX
        run: |
          pip install cyclonedx-bom
          cyclonedx-py requirements requirements.txt -o sbom.json

      - name: Sign SBOM (STaaS)
        shell: bash
        run: |
          HASH_HEX=$(sha256sum sbom.json | cut -d ' ' -f1)

          curl -X POST "https://sign.excid.io/API/Sign" \
            -H "Authorization: Bearer ${{ secrets.STAAS_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d @- \
            -o staas.bundle.json <<JSON
          {
            "HashHex": "${HASH_HEX}",
            "Comment": "SBOM signature generated by GitHub Actions: ${GITHUB_ACTION_URL}"
          }
          JSON

      - name: Upload CRACY signature as artifact
        uses: actions/upload-artifact@v4
        with:
          name: staas.bundle.json
          path: staas.bundle.json
          retention-days: 90

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            app.py
            sbom.json
            staas.bundle.json
          retention-days: 1

  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: generate-sbom
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              release-assets/app.py \
              release-assets/sbom.json \
              release-assets/staas.bundle.json \
              --clobber \
              --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${GITHUB_REF_NAME}" \
              release-assets/app.py \
              release-assets/sbom.json \
              release-assets/staas.bundle.json \
              --generate-notes \
              --verify-tag \
              --repo "${GITHUB_REPOSITORY}"
          fi
